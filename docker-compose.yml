name: looprewards
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}
services:
  db:
    image: postgres:16
    env_file: .env
    # tuned for an 8 GB server; scale shared_buffers (~25% RAM) and effective_cache_size (~60% RAM) with your RAM
    command: >
      postgres -c max_connections=200 -c shared_buffers=2GB -c effective_cache_size=5GB
      -c work_mem=8MB -c random_page_cost=1.1 -c log_min_duration_statement=500
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 10
    restart: always
    logging: *logging
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    restart: always
    logging: *logging
  web:
    build: .
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    volumes: [media:/app/media]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: always
    logging: *logging
  cron:  # daily: reminders, reward-expiry alerts, monthly vendor payouts
    build: .
    env_file: .env
    depends_on: [web]
    command: ["sh", "-c", "sleep 90; while true; do python manage.py send_reminders; python manage.py run_payouts; if [ \"x$$AUTO_PURGE\" = x1 ]; then python manage.py purge_lapsed --apply; else python manage.py purge_lapsed; fi; sleep 86400; done"]
    restart: always
    logging: *logging
  caddy:  # automatic HTTPS (Let's Encrypt), compression, serves uploaded files
    image: caddy:2
    env_file: .env
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: always
    logging: *logging
volumes: {pgdata: {}, media: {}, caddy_data: {}, caddy_config: {}}
